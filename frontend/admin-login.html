<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — University Auctions</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 2rem;
            background: var(--color-bg-card);
            border-radius: var(--r-lg);
            border: 1px solid var(--color-border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-top: 4px solid var(--color-danger);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .auth-form .form-group {
            margin-bottom: 1.5rem;
        }
        .auth-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-text-2);
        }
        .auth-form input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--r-md);
            background: var(--color-bg-subtle);
            color: var(--color-text);
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--color-danger);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }
        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
        }
        .auth-links a {
            color: var(--color-text-2);
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
        .btn-admin {
            background-color: var(--color-danger);
            color: white;
            border: none;
        }
        .btn-admin:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="site-logo">
                <span class="logo-mark">
                    <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 1L13 4V7C13 10.3 10.3 13 7 13C3.7 13 1 10.3 1 7V4L7 1Z"/>
                    </svg>
                </span>
                <span class="logo-text">University Auctions</span>
            </a>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">Auctions</a>
                <a href="about.html" class="nav-link">About</a>
            </nav>
            <div class="header-actions" id="auth-actions">
                <a href="login.html" class="nav-link btn btn-secondary btn-sm">User Login</a>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Switch to dark mode" title="Toggle theme">
                <svg class="theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="page-main">
        <div class="container">
            <div class="auth-container">
                <div class="auth-header">
                    <h1>Admin Portal</h1>
                    <p class="text-muted">Sign in to manage auctions.</p>
                </div>
                
                <div id="login-message"></div>
                
                <form class="auth-form" id="admin-login-form">
                    <div class="form-group">
                        <label for="email">Admin Email</label>
                        <input type="email" id="email" required placeholder="admin@university.edu">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-full btn-admin" id="login-btn">Secure Login</button>
                </form>
                
                <div class="auth-links">
                    <p><a href="login.html">Return to User Login</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/theme.js?v=1"></script>
    <script src="js/api.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
</body>
</html>
